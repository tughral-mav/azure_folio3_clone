<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Folio ESS employee self-service portal on Azure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FE"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00217F"/>
      <stop offset="1" stop-color="#143CD5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1742E7"/>
      <stop offset="1" stop-color="#2F69F2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F69F2"/>
      <stop offset="1" stop-color="#0170B9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#00217F" flood-opacity="0.16"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#00217F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="640" height="480" rx="24" fill="url(#bg)"/>
  <!-- flowing azure lines -->
  <path d="M-20 360 Q170 300 330 350 T680 300" stroke="#1742E7" stroke-width="2" opacity="0.10" fill="none"/>
  <path d="M-20 400 Q170 340 330 390 T680 340" stroke="#1742E7" stroke-width="2" opacity="0.08" fill="none"/>
  <path d="M-20 120 Q190 60 360 110 T700 70" stroke="#2F69F2" stroke-width="2" opacity="0.10" fill="none"/>
  <circle cx="556" cy="96" r="60" fill="#2F69F2" opacity="0.08"/>
  <circle cx="78" cy="392" r="46" fill="#1742E7" opacity="0.07"/>

  <!-- ===== dashboard card ===== -->
  <g filter="url(#soft)">
    <rect x="70" y="70" width="452" height="330" rx="18" fill="#FFFFFF"/>
    <!-- window chrome -->
    <rect x="70" y="70" width="452" height="46" rx="18" fill="#F5F8FE"/>
    <rect x="70" y="98" width="452" height="18" fill="#F5F8FE"/>
    <circle cx="96" cy="93" r="5" fill="#DAE3F8"/>
    <circle cx="114" cy="93" r="5" fill="#DAE3F8"/>
    <circle cx="132" cy="93" r="5" fill="#DAE3F8"/>
    <rect x="182" y="84" width="228" height="18" rx="9" fill="#FFFFFF" stroke="#DAE3F8"/>
    <rect x="196" y="90" width="120" height="6" rx="3" fill="#C7D4F2"/>

    <!-- greeting header -->
    <rect x="94" y="138" width="140" height="12" rx="6" fill="#121127"/>
    <rect x="94" y="158" width="96" height="8" rx="4" fill="#9FB0D8"/>
    <circle cx="486" cy="152" r="18" fill="url(#sky)"/>
    <text x="486" y="158" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>

    <!-- role tiles -->
    <g>
      <rect x="94" y="190" width="94" height="86" rx="12" fill="url(#navy)"/>
      <rect x="108" y="204" width="26" height="26" rx="7" fill="#FFFFFF" opacity="0.22"/>
      <rect x="108" y="244" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
      <rect x="108" y="256" width="34" height="7" rx="3.5" fill="#FFFFFF" opacity="0.45"/>

      <rect x="198" y="190" width="94" height="86" rx="12" fill="url(#blue)"/>
      <rect x="212" y="204" width="26" height="26" rx="7" fill="#FFFFFF" opacity="0.22"/>
      <rect x="212" y="244" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
      <rect x="212" y="256" width="34" height="7" rx="3.5" fill="#FFFFFF" opacity="0.45"/>

      <rect x="302" y="190" width="94" height="86" rx="12" fill="url(#sky)"/>
      <rect x="316" y="204" width="26" height="26" rx="7" fill="#FFFFFF" opacity="0.22"/>
      <rect x="316" y="244" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
      <rect x="316" y="256" width="34" height="7" rx="3.5" fill="#FFFFFF" opacity="0.45"/>

      <rect x="406" y="190" width="94" height="86" rx="12" fill="#EEF3FF" stroke="#DAE3F8"/>
      <rect x="420" y="204" width="26" height="26" rx="7" fill="#1742E7" opacity="0.14"/>
      <rect x="420" y="244" width="52" height="7" rx="3.5" fill="#1742E7" opacity="0.55"/>
      <rect x="420" y="256" width="34" height="7" rx="3.5" fill="#1742E7" opacity="0.28"/>
    </g>

    <!-- link rows -->
    <rect x="94" y="296" width="406" height="34" rx="9" fill="#F5F8FE"/>
    <rect x="108" y="307" width="22" height="12" rx="4" fill="#C7D4F2"/>
    <rect x="140" y="309" width="150" height="8" rx="4" fill="#9FB0D8"/>
    <rect x="430" y="307" width="56" height="12" rx="6" fill="#1742E7" opacity="0.85"/>
    <rect x="94" y="338" width="406" height="34" rx="9" fill="#F5F8FE"/>
    <rect x="108" y="349" width="22" height="12" rx="4" fill="#C7D4F2"/>
    <rect x="140" y="351" width="120" height="8" rx="4" fill="#9FB0D8"/>
    <rect x="430" y="349" width="56" height="12" rx="6" fill="#0170B9" opacity="0.7"/>
  </g>

  <!-- ===== phone overlay ===== -->
  <g filter="url(#soft2)" transform="translate(452,214)">
    <rect x="0" y="0" width="132" height="236" rx="26" fill="#050D20"/>
    <rect x="8" y="8" width="116" height="220" rx="20" fill="#FFFFFF"/>
    <rect x="46" y="16" width="40" height="9" rx="4.5" fill="#050D20"/>
    <!-- greeting -->
    <rect x="22" y="42" width="60" height="7" rx="3.5" fill="#9FB0D8"/>
    <rect x="22" y="56" width="80" height="10" rx="5" fill="#121127"/>
    <!-- approval alert -->
    <rect x="20" y="78" width="92" height="40" rx="10" fill="url(#blue)"/>
    <circle cx="38" cy="98" r="10" fill="#FFFFFF" opacity="0.25"/>
    <path d="M34 98l3 3 5-6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="54" y="90" width="46" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="54" y="102" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <!-- mini tiles -->
    <rect x="20" y="130" width="44" height="44" rx="10" fill="#EEF3FF"/>
    <rect x="30" y="140" width="18" height="18" rx="5" fill="#1742E7" opacity="0.5"/>
    <rect x="68" y="130" width="44" height="44" rx="10" fill="#EEF3FF"/>
    <rect x="78" y="140" width="18" height="18" rx="5" fill="#0170B9" opacity="0.5"/>
    <rect x="20" y="184" width="92" height="34" rx="9" fill="#F5F8FE"/>
    <rect x="30" y="194" width="50" height="7" rx="3.5" fill="#9FB0D8"/>
    <rect x="30" y="206" width="34" height="6" rx="3" fill="#C7D4F2"/>
  </g>

  <!-- azure cloud badge -->
  <g transform="translate(96,300)" filter="url(#soft2)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF"/>
    <path d="M-11 4c-5 0-9-4-9-8 0-4 3-7 7-8 1-5 5-8 10-8 4 0 8 3 9 7 4 0 7 3 7 7 0 5-4 8-9 8z" fill="url(#blue)"/>
  </g>
</svg>
