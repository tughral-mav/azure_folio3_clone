name: Cloudflare Deploy

# Production deploys on every push to master; PRs get an isolated preview URL
# (a Worker "version") posted back as a comment — the old Vercel review flow.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: cf-${{ github.ref }}
  cancel-in-progress: true

env:
  # Account IDs are not secret (they appear in dashboard URLs); the API token is.
  CLOUDFLARE_ACCOUNT_ID: ed122b6f3d67f68b89d148cf78d86be0

jobs:
  # ── PR preview: build + upload a version, comment its preview URL ────────────
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: azure-clone-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: azure-clone-next/package-lock.json
      - run: npm ci
      - name: Build + upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eo pipefail
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare upload 2>&1 | tee upload.log
          URL=$(grep -iE 'preview url' upload.log | grep -oiE 'https://[^ ]+\.workers\.dev' | head -1)
          [ -z "$URL" ] && URL=$(grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | tail -1)
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on the PR
        if: steps.upload.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.upload.outputs.preview_url }}';
            const marker = '<!-- cf-preview -->';
            const body = `${marker}\n### ⚡ Cloudflare preview\nThis PR is deployed at: ${url}\n\n_Rebuilt on every push to this PR. This is an isolated preview version — production is unaffected._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # ── Production: build + deploy the live Worker ──────────────────────────────
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: azure-clone-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: azure-clone-next/package-lock.json
      - run: npm ci
      - name: Build + deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eo pipefail
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
